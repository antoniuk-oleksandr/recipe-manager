services:
  recipes-manager-psql-db:
    image: postgres:17
    container_name: recipes-manager-psql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./volumes/recipes-manager-psql-db:/var/lib/postgresql/data
    networks:
      - recipes-manager-network

networks:
  recipes-manager-network:
    driver: bridge
